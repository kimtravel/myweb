<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 인덱스 페이지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 500px;
        }
        h1 {
            margin-bottom: 30px;
            color: #333333;
            font-size: 24px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
            background-color: #4f46e5;
            border-radius: 10px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn:hover {
            background-color: #4338ca;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-novel { background-color: #e61956; }
        .btn-novel:hover { background-color: #cc124b; }
        
        .btn-java { background-color: #2563eb; }
        .btn-java:hover { background-color: #1d4ed8; }

        .btn-letter { background-color: #059669; }
        .btn-letter:hover { background-color: #047857; }
    </style>
</head>
<body>

    <div class="container">
        <h1>원하시는 콘텐츠를 선택하세요</h1>
        <div class="btn-group">
            <!-- 소설 시리즈 첫 페이지 연결 -->
            <a href="book.html" class="btn btn-novel">📖 소설: 운수 좋은 날 (각색)</a>
            
            <!-- 자바 학습 페이지 연결 -->
            <a href="java.html" class="btn btn-java">💻 JDBC 프로그래밍 학습</a>
            
            <!-- 감성 메시지 카드 페이지 연결 -->
            <a href="letter.html" class="btn btn-letter">✉️ 감성 메시지 카드</a>
        </div>
    </div>

</body>
</html>
